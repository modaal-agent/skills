name: release

# Pushing a version tag publishes a GitHub release carrying one .zip per skill,
# the file claude.ai and the Claude desktop app take under Skills → Add → Upload
# skill. The other three install channels read main and ignore tags.
# CONTRIBUTING.md §"Releasing" is the procedure.
on:
  push:
    # The bare version: 0.1.0, 1.12.3. A tag such as v0.1.0 or 0.2.0-rc.1 runs nothing.
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  # ── Checks ───────────────────────────────────────────────────────
  # ci.yml's `rules` and `skills` jobs, run again at the tagged commit, so an
  # archive is built only from a tree that passes them.
  checks:
    uses: ./.github/workflows/ci.yml

  # ── Release ──────────────────────────────────────────────────────
  release:
    name: Skill archives (GitHub release)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Every branch, so the next step can look for the tagged commit on main.
          fetch-depth: 0

      - name: The tag points at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Delete the tag, and tag a commit on main."
            exit 1
          fi

      - name: CHANGELOG.md has a section for the version
        # The section's lines, down to the next ## heading, become the release notes.
        run: |
          awk -v head="## $GITHUB_REF_NAME" '
            /^## / { if (found) exit; found = ($0 == head || index($0, head " ") == 1); next }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section headed '## $GITHUB_REF_NAME — <date>', or the section is empty."
            exit 1
          fi

      - name: One archive per skill
        run: scripts/package-skills.sh dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
